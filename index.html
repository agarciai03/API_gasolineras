<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gasolineras España</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
    <script type="module" src="script.js" defer></script>
</head>

<body>
    <main>
        <h1>⛽ Gasolineras de España ⛽</h1>
        <form id="filtro-gasolineras">
            <label for="provincia">Provincia:</label>
            <select id="provincia" name="provincia">
                <option value="" disabled selected>Seleccionar</option>
            </select>

            <label for="municipio">Municipio:</label>
            <select id="municipio" name="municipio" disabled>
                <option value="" disabled selected>Seleccionar</option>
            </select>

            <label for="combustible">Tipo de Combustible:</label>
            <select id="combustible" name="combustible" disabled>
                <option value="" disabled selected>Seleccionar</option>
            </select>

            <div>
                <label for="abierta">Gasolineras abiertas</label>
                <input type="checkbox" name="abierta" id="abierta">
            </div>
            <br><br>
            <button type="submit">Buscar</button>
        </form>
        <section id="resultados">
        </section>
    </main>
</body>

</html>
